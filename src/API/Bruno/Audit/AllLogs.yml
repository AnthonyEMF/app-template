info:
  name: AllLogs
  type: http
  seq: 1

http:
  method: GET
  url: "{{API-URL}}/audit/logs?page=1&pageSize=5"
  params:
    - name: page
      value: "1"
      type: query
    - name: pageSize
      value: "5"
      type: query
  auth:
    type: bearer
    token: "{{TOKEN}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
