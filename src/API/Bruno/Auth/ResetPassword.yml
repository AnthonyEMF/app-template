info:
  name: ResetPassword
  type: http
  seq: 6

http:
  method: POST
  url: "{{API-URL}}/auth/reset-password"
  body:
    type: json
    data: |-
      {
        "email": "{{email}}",
        "resetToken": "{{RESET-TOKEN}}",
        "newPassword": "{{newPassword}}",
        "confirmPassword": "{{confirmPassword}}"
      }
  auth: inherit

runtime:
  variables:
    - name: email
      value: jperez@me.com
    - name: newPassword
      value: Temporal01!
    - name: confirmPassword
      value: Temporal01!

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
