info:
  name: ForgotPassword
  type: http
  seq: 4

http:
  method: POST
  url: "{{API-URL}}/auth/forgot-password"
  body:
    type: json
    data: |-
      {
        "email": "{{email}}"
      }
  auth: inherit

runtime:
  variables:
    - name: email
      value: jperez@me.com

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
