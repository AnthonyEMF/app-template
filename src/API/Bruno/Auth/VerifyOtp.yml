info:
  name: VerifyOtp
  type: http
  seq: 5

http:
  method: POST
  url: "{{API-URL}}/auth/verify-otp"
  body:
    type: json
    data: |-
      {
        "email": "{{email}}",
        "code": "{{code}}"
      }
  auth: inherit

runtime:
  variables:
    - name: email
      value: jperez@me.com
    - name: code
      value: "000000"
  scripts:
    - type: after-response
      code: |-
        let response = res.getBody()
        bru.setEnvVar("RESET-TOKEN", response.data?.resetToken ?? '')

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
